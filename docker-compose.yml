services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - LOG_CHANNEL=stderr

  ui:
    build:
      context: ./ui
      target: dev
    ports:
      - "3000:5173"
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://api:8000
    depends_on:
      - api

volumes:
  api_vendor:
  ui_node_modules:
